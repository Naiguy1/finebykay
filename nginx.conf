server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    include /etc/nginx/security-headers.conf;
    # The public site is read-only. Future APIs require an explicit reviewed location.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;
    autoindex off;
    # Avoid storing visitor IPs, query strings, referrers, or user agents here.
    # Review edge/proxy logs separately; Nginx error logs can still contain IPs.
    access_log off;
    error_log /dev/stderr crit;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    location / { try_files $uri $uri/ =404; }
    location ~ (^|/)\. { return 404; }
    location ~* (?:\.(?:ya?ml|env|pem|key|sql|sqlite3?|db|map|log|bak|ini|conf)|~)$ { return 404; }
    location ~* \.(webp|png|jpg|jpeg|svg|mp4|webm)$ {
        expires 7d;
        try_files $uri =404;
    }
    location /assets/ {
        expires 1y;
        # A location-level add_header replaces inherited headers; keep these here too.
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

