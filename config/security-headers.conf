# Included at server and immutable-asset scope (Nginx header inheritance).
# Inline style attributes are required by Motion; executable inline scripts stay blocked.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header X-Frame-Options DENY always;
add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; media-src 'self'; connect-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'self'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), browsing-topics=(), usb=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Cross-Origin-Resource-Policy same-origin always;
