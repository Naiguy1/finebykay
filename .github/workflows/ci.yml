name: Validate portfolio
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    permissions:
      contents: read
    outputs:
      build-outcome: ${{ steps.build.outcome }}
      browser-outcome: ${{ steps.browser.outcome }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --json > dependency-audit.json
        continue-on-error: true
      - run: npm run lint
      - run: npm run build 2>&1 | tee build.log
        id: build
        shell: bash
      - name: Check production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e 2>&1 | tee browser.log
        id: browser
        shell: bash
      - name: Verify production container
        id: container
        shell: bash
        run: |
          trap 'docker rm -f finebykay-ci >/dev/null 2>&1 || true' EXIT
          docker build -t finebykay-ci .
          docker run -d --name finebykay-ci -p 127.0.0.1:8080:8080 finebykay-ci
          docker exec finebykay-ci nginx -t
          python3 scripts/check_static_host.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: production-site-and-dependency-lock
          path: |
            dist/
            package-lock.json
            dependency-audit.json
            build.log
            browser.log
            test-results/
          retention-days: 7

  report:
    if: ${{ always() && github.event_name == 'push' }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: always()
        with:
          name: production-site-and-dependency-lock
          path: reports
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        if: always()
        env:
          BUILD_OUTCOME: ${{ needs.validate.outputs.build-outcome }}
          BROWSER_OUTCOME: ${{ needs.validate.outputs.browser-outcome }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('node:fs');
            const read = (path, fallback) => fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : fallback;
            const conclusion = (outcome) => outcome === 'success' ? 'success' : outcome === 'skipped' ? 'neutral' : 'failure';
            const build = read('reports/build.log', 'Build did not start.');
            await github.rest.checks.create({
              owner: context.repo.owner, repo: context.repo.repo, head_sha: context.sha,
              name: 'Production build report', status: 'completed',
              conclusion: conclusion(process.env.BUILD_OUTCOME),
              output: { title: 'TypeScript and Vite output', summary: build.slice(-60000) }
            });
            const audit = JSON.parse(read('reports/dependency-audit.json', '{"error":"Audit unavailable"}'));
            await github.rest.checks.create({
              owner: context.repo.owner, repo: context.repo.repo, head_sha: context.sha,
              name: 'Dependency audit report', status: 'completed',
              conclusion: !audit.metadata ? 'neutral' : (audit.metadata.vulnerabilities.high + audit.metadata.vulnerabilities.critical > 0 ? 'failure' : audit.metadata.vulnerabilities.total > 0 ? 'neutral' : 'success'),
              output: { title: 'Dependency audit', summary: JSON.stringify(audit, null, 2).slice(0, 60000) }
            });
            const browser = read('reports/browser.log', 'Browser tests did not start.');
            await github.rest.checks.create({
              owner: context.repo.owner, repo: context.repo.repo, head_sha: context.sha,
              name: 'Browser test report', status: 'completed',
              conclusion: conclusion(process.env.BROWSER_OUTCOME),
              output: { title: 'Desktop and mobile browser output', summary: browser.slice(-60000) }
            });
