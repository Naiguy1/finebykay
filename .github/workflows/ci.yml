name: Validate portfolio
on:
  push:
  pull_request:
permissions:
  contents: read
  checks: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run build 2>&1 | tee build.log
        id: build
      - uses: actions/github-script@v7
        if: always() && github.event_name == 'push' && steps.build.outcome != 'skipped'
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('build.log') ? fs.readFileSync('build.log', 'utf8') : 'Build did not start.';
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: context.sha,
              name: 'Production build report',
              status: 'completed',
              conclusion: '${{ steps.build.outcome }}' === 'success' ? 'success' : 'failure',
              output: { title: 'TypeScript and Vite output', summary: '```text\n' + log.slice(-60000) + '\n```' }
            });
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-site-and-dependency-lock
          path: |
            dist/
            package-lock.json
            test-results/
          retention-days: 7
