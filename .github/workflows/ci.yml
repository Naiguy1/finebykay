name: Validate portfolio
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Check CI diagnostics
        run: node --test scripts/report-validation.test.mjs
      - name: Install dependencies
        id: install
        run: |
          set -o pipefail
          npm ci 2>&1 | tee install.log
        shell: bash
      - name: Audit all dependencies
        id: audit
        run: |
          set -o pipefail
          npm audit --json 2> dependency-audit-error.log | tee dependency-audit.json
        shell: bash
      - name: Check editable content
        id: content
        run: |
          set -o pipefail
          npm run test:content 2>&1 | tee content.log
        shell: bash
      - name: Lint
        id: lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint.log
        shell: bash
      - name: Build production site
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
        id: build
        shell: bash
      - name: Check production dependency vulnerabilities
        id: production_audit
        run: |
          set -o pipefail
          npm audit --omit=dev --audit-level=high 2>&1 | tee production-audit.log
        shell: bash
      - name: Install browser test dependencies
        id: browser_install
        run: |
          set -o pipefail
          npx playwright install --with-deps chromium webkit 2>&1 | tee browser-install.log
        shell: bash
      - name: Run browser tests
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee browser.log
        id: browser
        shell: bash
      - name: Verify production container
        id: container
        shell: bash
        run: |
          trap 'docker rm -f finebykay-ci >/dev/null 2>&1 || true' EXIT
          set -o pipefail
          {
            passed=0
            for attempt in 1 2 3; do
              docker rm -f finebykay-ci >/dev/null 2>&1 || true
              if docker build -t finebykay-ci . &&
                docker run -d --name finebykay-ci -p 127.0.0.1:8080:8080 finebykay-ci &&
                docker exec finebykay-ci nginx -t &&
                python3 scripts/check_static_host.py; then
                passed=1
                break
              fi
              echo "Container verification attempt $attempt failed."
              sleep 5
            done
            test "$passed" -eq 1
          } 2>&1 | tee container.log
      # Never expose a write token to code from an untrusted fork. Keep the
      # ordinary pull_request event (not pull_request_target) for validation.
      - name: Publish validation details
        if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
        run: node scripts/report-validation.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPORT_STATUS: ${{ job.status }}
          REPORT_INSTALL: ${{ steps.install.outcome }}
          REPORT_AUDIT: ${{ steps.audit.outcome }}
          REPORT_CONTENT: ${{ steps.content.outcome }}
          REPORT_LINT: ${{ steps.lint.outcome }}
          REPORT_BUILD: ${{ steps.build.outcome }}
          REPORT_PRODUCTION_AUDIT: ${{ steps.production_audit.outcome }}
          REPORT_BROWSER_INSTALL: ${{ steps.browser_install.outcome }}
          REPORT_BROWSER: ${{ steps.browser.outcome }}
          REPORT_CONTAINER: ${{ steps.container.outcome }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: production-site-and-dependency-lock
          path: |
            dist/
            package-lock.json
            install.log
            dependency-audit.json
            dependency-audit-error.log
            production-audit.log
            browser-install.log
            content.log
            lint.log
            build.log
            browser.log
            container.log
            test-results/
          retention-days: 7
