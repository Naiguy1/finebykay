name: Validate portfolio
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --json > dependency-audit.json
      - run: npm run lint
      - run: npm run build 2>&1 | tee build.log
        id: build
        shell: bash
      - name: Check production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e 2>&1 | tee browser.log
        id: browser
        shell: bash
      - name: Verify production container
        id: container
        shell: bash
        run: |
          trap 'docker rm -f finebykay-ci >/dev/null 2>&1 || true' EXIT
          set -o pipefail
          {
            passed=0
            for attempt in 1 2 3; do
              docker rm -f finebykay-ci >/dev/null 2>&1 || true
              if docker build -t finebykay-ci . &&
                docker run -d --name finebykay-ci -p 127.0.0.1:8080:8080 finebykay-ci &&
                docker exec finebykay-ci nginx -t &&
                python3 scripts/check_static_host.py; then
                passed=1
                break
              fi
              echo "Container verification attempt $attempt failed."
              sleep 5
            done
            test "$passed" -eq 1
          } 2>&1 | tee container.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: production-site-and-dependency-lock
          path: |
            dist/
            package-lock.json
            dependency-audit.json
            build.log
            browser.log
            container.log
            test-results/
          retention-days: 7
