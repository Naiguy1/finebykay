# FINEBYKAY — EDIT YOUR NAIL SETS HERE
# Save this file, then rebuild and deploy the website to publish your changes.
# Keep each id unchanged: it is the permanent link people share.
# name = visible title; description = the short story beside the photograph.
# image_description = accessible text describing what is actually visible.
# Descriptions describe the designs. Edit them whenever you like.
# lookbook_order selects and orders the curated grid; omit it for carousel-only sets.
# You can write descriptions across several indented lines after >-.
# Categories: Natural Nails | Structured Gel | Intricate Art
# Copy an entire entry to add a set, give it a NEW id, and add its photo in public/media/.
# Optional fields: high_resolution, image_position (e.g. "50% 50%"), video.
# Videos also require captions: /media/detail.vtt and a video_description of the visuals.

